<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; base-uri 'none'; form-action 'self'" />
  <title>資訊資產管控系統｜杏和醫療體系</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <!-- 登入 -->
  <div id="loginView" class="login hidden">
    <form id="loginForm" class="login-card" autocomplete="on">
      <h1>資訊資產管控系統</h1>
      <p class="sub">杏永醫院・杏和醫院・護理之家・診所</p>
      <label>Email<input type="email" id="loginEmail" required autocomplete="username" /></label>
      <label>密碼<input type="password" id="loginPassword" required autocomplete="current-password" /></label>
      <button class="btn primary" type="submit" id="loginBtn">登入</button>
      <p id="loginMsg" class="msg"></p>
      <p class="hint">本系統僅限授權資訊人員使用，所有操作都會留下紀錄。</p>
    </form>
  </div>

  <!-- 待啟用 -->
  <div id="pendingView" class="login hidden">
    <div class="login-card">
      <h1>帳號尚未啟用</h1>
      <p class="sub">請聯絡系統管理者啟用您的帳號並指派角色。</p>
      <button class="btn" id="pendingLogout">登出</button>
    </div>
  </div>

  <!-- 主畫面 -->
  <div id="appView" class="app hidden">
    <aside class="side" id="side">
      <div class="brand">資訊資產管控</div>
      <nav id="nav"></nav>
    </aside>
    <div class="main">
      <header class="top">
        <button class="btn ghost menu-btn" id="menuBtn" aria-label="選單">☰</button>
        <h2 id="pageTitle"></h2>
        <div class="who"><span id="whoLabel"></span><button class="btn ghost" id="logoutBtn">登出</button></div>
      </header>
      <main id="content"></main>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- 第三方程式庫：固定版本並以 SRI 雜湊驗證內容，被竄改時瀏覽器會拒絕執行 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"
          integrity="sha256-hZaWX+kY5lZgChtWjToWj1wNPSKmAIhrtvRKZVXbAec=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"
          integrity="sha256-fknaaFiOJQ27i7oZDSyqirN4fMAoS9odiy+AXE33Qsk=" crossorigin="anonymous"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
