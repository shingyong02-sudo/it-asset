<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; base-uri 'none'; form-action 'self'" />
  <title>資訊資產管控系統｜杏和醫療體系</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <!-- 登入 -->
  <div id="loginView" class="login hidden">
    <form id="loginForm" class="login-card" autocomplete="on">
      <h1>資訊資產管控系統</h1>
      <p class="sub">杏永醫院・杏和醫院・護理之家・診所</p>
      <label>Email<input type="email" id="loginEmail" required autocomplete="username" /></label>
      <label>密碼<input type="password" id="loginPassword" required autocomplete="current-password" /></label>
      <button class="btn primary" type="submit" id="loginBtn">登入</button>
      <p id="loginMsg" class="msg"></p>
      <p class="hint">本系統僅限授權資訊人員使用，所有操作都會留下紀錄。</p>
      <p class="hint"><a href="#/apply">還沒有帳號？申請帳號</a>　｜　<a href="#/reset">忘記密碼</a></p>
    </form>
  </div>

  <!-- 忘記密碼 -->
  <div id="resetView" class="login hidden">
    <form id="resetForm" class="login-card" autocomplete="off">
      <h1>忘記密碼</h1>
      <p class="sub">輸入新密碼送出後，需由管理者確認身分（會以分機聯絡）並核准，新密碼才會生效。</p>
      <label>Email（登入帳號）<input type="email" id="rsEmail" required maxlength="120" autocomplete="username" /></label>
      <label>姓名<input id="rsName" required maxlength="40" /></label>
      <label>分機<input id="rsExt" required maxlength="20" inputmode="numeric" /></label>
      <label>新密碼（至少 8 字元）<input type="password" id="rsPw" required minlength="8" maxlength="72" autocomplete="new-password" /></label>
      <label>再輸入一次新密碼<input type="password" id="rsPw2" required minlength="8" maxlength="72" autocomplete="new-password" /></label>
      <div class="captcha" id="rsCaptcha"></div>
      <input id="rsWebsite" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true" />
      <button class="btn primary" type="submit" id="rsBtn">送出重設申請</button>
      <p id="rsMsg" class="msg"></p>
      <p class="hint"><a href="#/">返回登入</a></p>
    </form>
  </div>

  <!-- 申請帳號 -->
  <div id="applyView" class="login hidden">
    <form id="applyForm" class="login-card" autocomplete="off">
      <h1>申請帳號</h1>
      <p class="sub">送出後由管理者審核並指定權限，核准後即可用下方 Email 與密碼登入。</p>
      <label>姓名<input id="apName" required maxlength="40" /></label>
      <label>分機<input id="apExt" required maxlength="20" inputmode="numeric" /></label>
      <label>單位<input id="apDept" required maxlength="60" /></label>
      <label>Email（登入帳號）<input type="email" id="apEmail" required maxlength="120" autocomplete="username" /></label>
      <label>密碼（至少 8 字元）<input type="password" id="apPw" required minlength="8" maxlength="72" autocomplete="new-password" /></label>
      <label>再輸入一次密碼<input type="password" id="apPw2" required minlength="8" maxlength="72" autocomplete="new-password" /></label>
      <div class="captcha" id="apCaptcha"></div>
      <input id="apWebsite" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true" />
      <button class="btn primary" type="submit" id="apBtn">送出申請</button>
      <p id="apMsg" class="msg"></p>
      <p class="hint"><a href="#/">返回登入</a></p>
    </form>
  </div>

  <!-- 待啟用 -->
  <div id="pendingView" class="login hidden">
    <div class="login-card">
      <h1>帳號尚未啟用</h1>
      <p class="sub">請聯絡系統管理者啟用您的帳號並指派角色。</p>
      <button class="btn" id="pendingLogout">登出</button>
    </div>
  </div>

  <!-- 主畫面 -->
  <div id="appView" class="app hidden">
    <aside class="side" id="side">
      <div class="brand">資訊資產管控</div>
      <nav id="nav"></nav>
    </aside>
    <div class="main">
      <header class="top">
        <button class="btn ghost menu-btn" id="menuBtn" aria-label="選單">☰</button>
        <h2 id="pageTitle"></h2>
        <div class="who"><span class="tag ok online" id="onlineLabel" title="目前上線人數">上線 0 人</span><span id="whoLabel"></span><button class="btn ghost" id="pwBtn">修改密碼</button><button class="btn ghost" id="logoutBtn">登出</button></div>
      </header>
      <main id="content"></main>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- 第三方程式庫：固定版本並以 SRI 雜湊驗證內容，被竄改時瀏覽器會拒絕執行 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"
          integrity="sha256-hZaWX+kY5lZgChtWjToWj1wNPSKmAIhrtvRKZVXbAec=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"
          integrity="sha256-fknaaFiOJQ27i7oZDSyqirN4fMAoS9odiy+AXE33Qsk=" crossorigin="anonymous"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
